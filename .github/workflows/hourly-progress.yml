name: Hourly Build Progress Snapshot

on:
  schedule:
    # Every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  update-progress:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate progress snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Infinitum Corporation Build Progress" > PROGRESS.md
          echo "" >> PROGRESS.md
          echo "**Last updated:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> PROGRESS.md
          echo "**Generated by:** GitHub Actions hourly workflow" >> PROGRESS.md
          echo "" >> PROGRESS.md
          echo "## Repository Status" >> PROGRESS.md
          echo "" >> PROGRESS.md
          gh api --paginate /orgs/InfinitumCorp/repos --jq '.[] | "- [\(.name)](\(.html_url)): updated \(.updated_at), open issues: \(.open_issues_count)"' >> PROGRESS.md || echo "Note: Using user repos or limited access" >> PROGRESS.md
          echo "" >> PROGRESS.md
          echo "---" >> PROGRESS.md
          echo "*Automated. Website source is never modified by this process.*" >> PROGRESS.md

      - name: Commit and push if changed
        run: |
          git config user.name "Infinitum Progress Bot"
          git config user.email "progress@infinitumcorp.github"
          git add PROGRESS.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Hourly progress update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
